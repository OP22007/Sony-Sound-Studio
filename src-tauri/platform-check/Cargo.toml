[package]
name = "sound-connect-platform-check"
version = "0.1.0"
edition = "2021"
publish = false

# Check the actual transport sources without needing the desktop webview/toolchain.
[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media", "Media_Control", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Foundation", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSRunLoop", "NSObjCRuntime", "NSObject", "NSString"] }
objc2-io-bluetooth = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothObject", "IOBluetoothDevice", "IOBluetoothRFCOMMChannel", "IOBluetoothSDPUUID", "IOBluetoothSDPServiceRecord", "IOBluetoothTypes"] }
