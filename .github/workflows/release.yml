name: Desktop preview builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v0.1.3

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted release tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Require a versioned commit on protected main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -f "docs/releases/$RELEASE_TAG.md"
          node -e 'const fs=require("fs"); const v=process.env.RELEASE_TAG.slice(1); for(const p of ["package.json","src-tauri/tauri.conf.json"]) { if(JSON.parse(fs.readFileSync(p)).version !== v) throw Error("Release version mismatch: "+p); }'

  build:
    needs: validate
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            config: src-tauri/tauri.macos.conf.json
          - label: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            config: src-tauri/tauri.macos.conf.json
          - label: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            config: src-tauri/tauri.linux.conf.json
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            config: src-tauri/tauri.windows.conf.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - run: npm ci
      - name: Frontend and extension checks
        run: |
          npm run build
          node --test extensions/media-mode/test/extension.test.cjs
      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}
        # Intel binaries are cross-compiled on an ARM Mac; tests execute on the native Mac job.
        if: matrix.target != 'x86_64-apple-darwin'
      - name: Package native app
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --config ${{ matrix.config }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect installers and checksums
        shell: bash
        run: node scripts/collect-release-assets.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: src-tauri/target/release-assets/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-22.04
    concurrency:
      group: updater-preview-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish version release, then update signed preview channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PREVIEW_TAG: updater-preview
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "$RELEASE_TAG — Cross-platform preview" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file "docs/releases/$RELEASE_TAG.md"

          mkdir -p previous-feed
          previous_args=()
          if gh release view "$PREVIEW_TAG" > /dev/null 2>&1; then
            gh release download "$PREVIEW_TAG" --pattern latest.json --dir previous-feed
            previous_args+=("$PWD/previous-feed/latest.json")
          fi
          published_at=$(gh release view "$RELEASE_TAG" --json publishedAt --jq .publishedAt)
          node scripts/generate-updater-manifest.mjs release-assets "$RELEASE_TAG" "docs/releases/$RELEASE_TAG.md" "$published_at" "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG" latest.json "${previous_args[@]}"

          if ! gh release view "$PREVIEW_TAG" > /dev/null 2>&1; then
            gh release create "$PREVIEW_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "App update feed (metadata only)" --notes "Machine-readable update feed. Download installers from [$RELEASE_TAG](https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG)."
          fi
          gh release edit "$PREVIEW_TAG" --draft=false --prerelease --title "App update feed (metadata only)" --notes "Machine-readable update feed. Download installers from [$RELEASE_TAG](https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG)."
          gh release upload "$PREVIEW_TAG" latest.json --clobber
